<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{title}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0d0d0d; color:#eee; font-family:'Raleway',sans-serif; }
  .share-icon { background:linear-gradient(10deg,#E53935,#8E24AA);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  #shareLink { position:absolute; top:5px; right:10px; z-index:999; }
  .grad { background:linear-gradient(to right,#ec4899,#8b5cf6);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
</style>
</head>
<body class="bg-black">
<header>
  <div class="container-fluid">
    <a href="#" class="text-light fs-4" id="shareLink">
      <span class="grad fw-bold">Share</span>
      <i class="bi bi-share share-icon"></i>
    </a>
  </div>
</header>

<div class="bg-black text-light pt-3">
  <div class="justify-content-center align-items-center w-100 d-flex">
    <div class="text-center p-2">
      <p class="fw-bold fs-5 grad animate__animated animate__fadeInRight">{filename}</p>
      <small class="text-secondary">{size} · {mime}</small>
    </div>
  </div>

  <div class="justify-content-center align-items-center w-100 d-flex flex-wrap">
    <div class="lg:w-9/12 w-full border border-danger px-2 animate__animated animate__fadeInLeft">
      <{tag} src="{dl_url}" id="player" class="player"
         style="--plyr-color-main:#d24db2;" playsinline controls></{tag}>
    </div>
  </div>

  <div class="d-flex justify-content-center gap-3 mt-3 pb-2">
    <div onclick="vlc_player()" class="card card-body bg-dark text-secondary text-center" style="cursor:pointer;width:130px">
      <i class="bi bi-play-circle fs-2"></i>VLC Player
    </div>
    <div onclick="mx_player()" class="card card-body bg-dark text-secondary text-center" style="cursor:pointer;width:130px">
      <i class="bi bi-play-btn fs-2"></i>MX Player
    </div>
    <a href="{dl_url}" download="{filename}" class="card card-body bg-dark text-secondary text-center text-decoration-none" style="width:130px">
      <i class="bi bi-download fs-2"></i>Download
    </a>
  </div>
</div>

<footer class="text-center py-3 bg-black">
  <small class="grad fw-bold">Personal File Sharing</small>
</footer>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const controls = ['play-large','rewind','play','fast-forward','progress',
    'current-time','duration','mute','volume','settings','pip','fullscreen','download'];
  document.addEventListener('DOMContentLoaded', () => { Plyr.setup('.player', { controls }); });

  const dlUrl = "{dl_url}";
  function vlc_player()  { window.location.href = `vlc://${{dlUrl}}`; }
  function mx_player()   { window.location.href = `intent:${{dlUrl}}#Intent;package=com.mxtech.videoplayer.ad;end`; }

  const shareBtn = document.getElementById('shareLink');
  if (navigator.share) {
    shareBtn.addEventListener('click', () =>
      navigator.share({ title: document.title, url: window.location.href })
    );
  }

  document.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
