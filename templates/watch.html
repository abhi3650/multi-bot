<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{file_name}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/proavipatil/data@main/fs/src/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/proavipatil/data@main/fs/src/plyr.css">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#0d0d0d;color:#eee;font-family:'Josefin Sans',sans-serif;margin:0">
<nav style="display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:#111;border-bottom:1px solid #333">
  <h3 style="margin:0;background:linear-gradient(to right,#ec4899,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent">FILE STREAM</h3>
</nav>

<div style="display:flex;flex-direction:column;align-items:center;padding:2rem 1rem">
  <p style="font-size:1.1rem;font-weight:600;text-align:center;word-break:break-all;margin-bottom:.5rem">{file_name}</p>
  <small style="color:#888;margin-bottom:1.5rem">{file_size}</small>

  <div style="width:100%;max-width:900px;border:1px solid #e53935;border-radius:8px;overflow:hidden">
    <{tag} id="player" src="{file_url}" playsinline controls
      style="width:100%;background:#000;display:block"></{tag}>
  </div>

  <div style="display:flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap;justify-content:center">
    <button onclick="streamDownload()" style="padding:.7rem 1.5rem;background:#e53935;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit">
      ⬇️ Download
    </button>
    <button onclick="copyLink()" style="padding:.7rem 1.5rem;background:#333;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit">
      🔗 Copy Link
    </button>
    <button onclick="vlcPlayer()" style="padding:.7rem 1.5rem;background:#333;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit">
      📺 VLC
    </button>
    <button onclick="mxPlayer()" style="padding:.7rem 1.5rem;background:#333;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit">
      🎬 MX Player
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/proavipatil/data@main/fs/src/plyr.js"></script>
<script>
  const fileUrl = "{file_url}";
  const player  = new Plyr('#player', {{
    controls: ['play-large','rewind','play','fast-forward','progress',
               'current-time','duration','mute','volume','settings','fullscreen']
  }});
  function streamDownload() {{ window.location.href = fileUrl + "?download=1"; }}
  function copyLink()       {{ navigator.clipboard.writeText(window.location.href); alert("Link copied!"); }}
  function vlcPlayer()      {{ window.location.href = "vlc://" + fileUrl; }}
  function mxPlayer()       {{ window.location.href = "intent://" + fileUrl + "#Intent;package=com.mxtech.videoplayer.ad;end"; }}
  document.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
